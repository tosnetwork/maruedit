name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build app and create DMG
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: bash create-dmg.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MaruEdit ${{ steps.version.outputs.tag }}
          body_path: docs/release-notes-${{ steps.version.outputs.number }}.md
          files: |
            MaruEdit-${{ steps.version.outputs.number }}.dmg
            MaruEdit-${{ steps.version.outputs.number }}.dmg.sha256
          draft: false
          prerelease: false
